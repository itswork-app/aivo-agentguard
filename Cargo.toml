[workspace]
resolver = "2"
members = [
  "crates/agentguard-core",
  "crates/agentguard-policy",
  "crates/agentguard-canonical",
  "crates/agentguard-evidence",
  "crates/agentguard-runtime",
  "crates/agentguard-enforcement",
  "crates/agentguard-evidence-postgres",
]

[workspace.package]
license = "Apache-2.0"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/itswork-app/aivo-agentguard"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
